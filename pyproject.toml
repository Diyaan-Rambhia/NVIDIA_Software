[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fininsight"
version = "0.1.0"
description = "India-focused financial intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml",
    "numpy",
    "scipy",
    "scikit-learn",
    "psycopg[binary]>=3.2.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.2",
    "pypdf>=5.0.0",
    "yfinance>=0.2.50",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/feasibility"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
