    let host = window && window.location && window.location.hostname
    let ip = window.location.protocol + "//" + host + ":" + window.location.port
    let node = document.createElement('script')
    let url = `${ip}/advancedmaps/v1/6be418533ae43193658f04a69df3936a/map_load?v=1.5&plugin=cluster`
    if (host == 'localhost')
      node.src = 'https://apis.mapmyindia.com/advancedmaps/v1/11oj6ftmmejr8bg6sdqw3futymo5cmwc/map_load?v=1.5&plugin=cluster'
    else
      node.src = url      
    node.async = false
    document.getElementsByTagName('head')[0].appendChild(node)
    // sessionStorage.setItem('mapLoaded',false)
    sessionStorage.removeItem('mapLoaded')
    // console.log('script loading started')
    node.onload = () => {
      sessionStorage.setItem('mapLoaded', true)
      // console.log('script loaded')
    }
  </script>
